<!DOCTYPE html>
<html>
<head>
    <title>Verfügbarkeit | Gaffel Kölsch</title>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
    @font-face {
      font-family: "Barlow-Regular";
      src: url("https://muehlenkoelsch.de/wp-content/uploads/2024/09/Barlow-Regular.woff2") format("woff2");
      font-display: swap;
    }

     @font-face {
      font-family: "Acumin Variable";
      src: url("https://muehlenkoelsch.de/wp-content/uploads/2025/09/AcuminPro-Bold.woff2") format("woff2");
      font-display: swap;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: "Acumin Variable", sans-serif;
      font-size: 18px;
    }

    .leaflet-popup-content,
    .leaflet-popup-content-wrapper {
        font-family: "Barlow-Regular", sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #controls {
      padding: 8px;
      background: rgb(0, 0, 0);
      position: absolute;
      width: fit-content;
      left: 60px;
      z-index: 1000;
      margin: 10px;
      border-radius: 8px;
      border: 3px solid #00703c;
    }
    
    .marker-legend {
        width: 21px;
        height: 31px;
        display: block;
        object-fit: contain;
        margin-top: 2px;
        margin-left: 4px;
        transform: translateY(-2px);
    }

    .control-item {
        display: flex;
        align-items: center;
        gap: 2px;
        cursor: pointer;
    }

    .control-item input[type="checkbox"] {
        cursor: pointer;
        flex: 0 0 auto;
    }

    .label-text {
        display: block;
        line-height: normal;
        padding-top: 0.2em;
        color:#F8F8F8;
        margin-left: 8px;
    }

    .popup-name {
        font-family: "Acumin Variable", sans-serif;
        font-size: 18px;
        font-weight: bold;
        line-height: 1;    
    }

    .popup-address {
        font-size: 14px;
        color: #666;
        margin-bottom: 6px;
    }

    .popup-sorten {
        font-family: "Acumin Variable", sans-serif;
        background: #f8f8f8;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 10px;
        line-height: 1.4;
        border-left: 4px solid #00263e;
    }
    
    .popup-route {
        text-align: center;
    }

    .popup-route a {
        display: inline-block;
        padding: 6px 10px;
        background: #0078ff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
    }

    .status-ok {
        color: #00703c;
        font-family: "Barlow-Regular", sans-serif;
    }

    .status-no {
        color: #c62828;
        font-family: "Barlow-Regular", sans-serif;
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
        background-color: #fffaee !important;
    }

    .marker-cluster div {
        background-color: #00263e !important;
        color: white !important;
        font-family: "Acumin Variable", sans-serif;
        font-weight: bold; 
    }

    .leaflet-marker-pane
    {
        transition: opacity 0.15s ease-out;
    }

    @media (max-width: 768px) {
        #controls {
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
        }
    }
    </style>
</head>

<body>

     <div id="controls">
        <label class="control-item" style="margin-bottom: 0px;">
            <input type="checkbox" id="gastronomie" checked>
            <span class="label-text">Gastronomie</span>
            <img
            src="https://raw.githubusercontent.com/gaf-luis/map_data/main/gaffel_marker_small_g.png"
            alt="Gastronomie Marker"
            class="marker-legend">
        </label>

        <label class="control-item">
            <input type="checkbox" id="handel" checked>
            <span class="label-text">Handel</span>
            <img
            src="https://raw.githubusercontent.com/gaf-luis/map_data/main/gaffel_marker_small_g.png",
            alt="Handel Marker"
            class="marker-legend">
        </label>
    </div>
    
    <div id="map"></div>
    
    <script>
        const isMobile = L.Browser.mobile;

        const map = L.map('map', {
            preferCanvas: true,
            fadeAnimation: !isMobile,
            markerZoomAnimation: !isMobile,
            inertia: true
        }).setView([50.94, 6.96], 12);

        map.options.zoomSnap = 0.5;
        map.options.zoomDelta = 0.5;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            updateWhenZooming: false,
            updateWhenIdle: false,
            keepBuffer: 4,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
        }).addTo(map);

        const cluster = L.markerClusterGroup({
            disableClusteringAtZoom: 15,
            maxClusterRadius: 150, 
            spiderfyOnMaxZoom: false,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            chunkedLoading: true,
            chunkInterval: 50

        });

        cluster.addTo(map);

        const markersByType = {};
        const allMarkers = [];

        const customIcon_red = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/gaffel_marker_small_g.png',
            iconSize: [25, 39],
            iconAnchor: [12.5, 39],
            popupAnchor: [0, -24]
        });

        const customIcon_green = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/gaffel_marker_small_g.png',
            iconSize: [25, 39],
            iconAnchor: [12.5, 39],
            popupAnchor: [0, -24]
        });

        function updateVisibleMarkers() {
    const showGastronomie = document.getElementById("gastronomie").checked;
    const showHandel = document.getElementById("handel").checked;

    const visibleMarkers = [];

    if (showGastronomie && markersByType["Gastronomie"]) {
        visibleMarkers.push(...markersByType["Gastronomie"]);
    }

    if (showHandel && markersByType["Handel"]) {
        visibleMarkers.push(...markersByType["Handel"]);
    }

    cluster.clearLayers();
    cluster.addLayers(visibleMarkers);
}

        (async () => {
        try {
            
            const res = await fetch("https://raw.githubusercontent.com/gaf-luis/map_data/main/test_gaffel_map_data.json");
            console.log("status", res.status, res.ok);
            const locations = await res.json();
                    
            locations.forEach(loc => {

                    const icon =
                    loc.absatzweg === "Gastronomie"
                        ? customIcon_red
                        : customIcon_green;

                    const address = loc.kombi_addr;

                    const filter_criteria = loc.absatzweg

                    const marker = L.marker([loc.lat, loc.lng], { icon: icon })
                    .bindPopup(`
                        <div class="popup-name">${loc.name}</div>
                        <div class="popup-address">
                            ${loc.strasse}, ${loc.plz} ${loc.ort}
                        </div>
                        <div class="popup-sorten">
                            ${String(loc.sorten)
                            .replace(/Nicht\s*verfügbar/g, '<span class="status-no">Nicht verfügbar</span>')
                            .replace(/\bVerfügbar\b/g, '<span class="status-ok">Verfügbar</span>')
                            }
                        
                        </div>
                        <div class="popup-route">
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${address}"
                            target="_blank">
                            Routenplaner
                            </a>
                        </div>
                    `);
                    
                    allMarkers.push(marker);


                    if (!(filter_criteria in markersByType)) {  
                        markersByType[filter_criteria]=[]          
                    }
                    markersByType[filter_criteria].push(marker);
            })

            cluster.addLayers(allMarkers);

            } catch (err) {
                console.error("Failed to load map data:", err);
            }
        })();

       document.getElementById("gastronomie").addEventListener("change", updateVisibleMarkers);
document.getElementById("handel").addEventListener("change", updateVisibleMarkers);

updateVisibleMarkers();

</script>
</body>
</html>
