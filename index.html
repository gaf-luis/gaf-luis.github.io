<!DOCTYPE html>
<html>
<head>
    <title>Verfügbarkeit | Gaffel Kölsch</title>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
    @font-face {
        font-family: "HelveticaNeueLtCom-Roman";
        src: url("https://gaffel.de/wp-content/themes/Divi-Child-Theme/fonts/HelveticaNeueLTCom-Roman.ttf") format("truetype");
        font-display: swap;
    }

     @font-face {
        font-family: "HelveticaNeueLtCom-Bold";
        src: url("https://gaffel.de/wp-content/themes/Divi-Child-Theme/fonts/HelveticaNeueLTCom-Bd.ttf") format("truetype");
        font-display: swap;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: "HelveticaNeueLtCom-Roman", Helvetica, sans-serif;
      font-size: 18px;
    }

    .leaflet-popup-content,
    .leaflet-popup-content-wrapper {
        font-family: "HelveticaNeueLtCom-Roman", Helvetica, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #control-panel {
        background: #00263e;;
        position: absolute;
        width: fit-content;
        left: 60px;
        z-index: 1000;
        margin: 10px;
        border-radius: 8px;
        border: 3px solid #00174c;
        width: max-content;
        overflow: hidden;
    }

    #control-logo {
        text-align: center;
        padding: 0px 10px;
        margin: 0;
        box-sizing: border-box;
        width: 100%;
        line-height: 0;
        background: #00174c;
    }

    #controls {
      padding: 8px;
      background:#ffffff
    }

    #map-logo {
        width: 180px;
        height: auto;
        display: block;
        margin: 0 auto;
    }

    #map-logo-mobile {
        display: none;
    }

    .marker-legend {
        width: 20px;
        height: auto;
        display: block;
        object-fit: contain;
        margin-top: 1px;
        margin-left: 4px;
        transform: translateY(-2px);
    }

    .control-item {
        display: flex;
        align-items: center;
        gap: 2px;
        cursor: pointer;
    }

    .control-item:hover {
        background: rgba(58, 96, 119, 0.08);
        border-radius: 4px;
}

    .control-item input[type="checkbox"] {
        cursor: pointer;
        flex: 0 0 auto;
        accent-color: #0072bc;
    }
    
    .label-text {
        font-weight: bold;
        display: block;
        line-height: normal;
        padding-top: 0.1em;
        color:#00174c;
        margin-left: 8px;
    }

    .popup-name {
        font-size: 18px;
        font-weight: bold;
        line-height: 1;    
    }

    .popup-address {
        font-size: 14px;
        color: #666;
        margin-bottom: 6px;
    }

    .popup-sorten {
        background: #f8f8f8;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 10px;
        line-height: 1.4;
        border-left: 4px solid rgb(0, 23, 76);
    }
    
    .popup-route {
        text-align: center;
    }

    .popup-route a {
        display: inline-block;
        padding: 6px 10px;
        background: #0078ff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
    }

    .status-ok {
        color: #00703c;
    }

    .status-no {
        color: #c62828;
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
        background-color:rgb(0, 23, 76, 0.3) !important;
    }

    .marker-cluster div {
        background-color: rgb(0, 23, 76, 0.8) !important;
        color: rgb(255, 255, 255) !important;
        font-weight: bold; 
    }

    .leaflet-marker-pane{
        transition: opacity 0.15s ease-out;
    }

    .leaflet-tile {
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
    }

    .leaflet-tile-container {
        will-change: transform;
    }
    



    @media (max-width: 768px) {

        #control-panel {
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid #001c48;
            overflow: hidden;
            display: inline-flex;
            flex-direction: row ;
            align-items: stretch;
        }

        #control-logo {
            background: #001c48;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            flex: 0 0 auto;
        }

        #map-logo-mobile {
            width: 85px;
            height: auto;
            display: block;
            margin: 0;
        }

        #map-logo {
            display: none;
        }

        #controls {
            padding: 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
        }

        .control-item {
            padding: 0px 0px;
            gap: 0px;
        }

        .marker-legend {
            width: 19px;
            height: auto;
            margin-top: 0px;
            margin-left: 6px;
            transform: translateY(-1px);
        }
}
    </style>
</head>

<body>
    <div id="control-panel">

        <div id="control-logo">
            <img
                src="https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel%20Kölsch%20Logo%20einzeilig%20negativ%20blau.jpg"
                alt="Gaffel Logo"
                id="map-logo"
            >
            <img
                src="https://gaffel.de/wp-content/uploads/2021/06/Gaffel-Logo-white.svg"
                alt="Gaffel Logo"
                id="map-logo-mobile"
            >
        </div>

        <div id="controls">
            <label class="control-item" style="margin-bottom: 0px;">
                <input type="checkbox" id="gastronomie" checked>
                <span class="label-text">Gastronomie</span>
                <img
                src="https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_blau.png"
                alt="Gastronomie Marker"
                class="marker-legend">
            </label>

            <label class="control-item">
                <input type="checkbox" id="handel" checked>
                <span class="label-text">Handel</span>
                <img
                src="https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_weiss_4.png",
                alt="Handel Marker"
                class="marker-legend">
            </label>
        </div>
    </div>
    
    <div id="map"></div>
    
    <script>
        const isMobile = L.Browser.mobile;

        const map = L.map('map', {
            preferCanvas: true,
            //fadeAnimation: !isMobile,
            //markerZoomAnimation: !isMobile,
            inertia: true
        }).setView([50.94, 6.96], 12);

        

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            updateWhenZooming: false,
            updateWhenIdle: false,
            keepBuffer: 4,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
        }).addTo(map);

        const cluster = L.markerClusterGroup({
            disableClusteringAtZoom: 14,
            maxClusterRadius: 100, 
            spiderfyOnMaxZoom: false,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            chunkedLoading: true,
            chunkInterval: 50

        });

        cluster.addTo(map);

        const markersByType = {};
        const allMarkers = [];

        const marker_gastro = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_blau.png',
            iconSize: [25, 42],
            iconAnchor: [12.5, 41],
            popupAnchor: [0, -24]
        });

        const marker_handel = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_weiss_4.png',
            iconSize: [25, 42],
            iconAnchor: [12.5, 41],
            popupAnchor: [0, -24]
        });

        function updateVisibleMarkers() {
    const showGastronomie = document.getElementById("gastronomie").checked;
    const showHandel = document.getElementById("handel").checked;

    const visibleMarkers = [];

    if (showGastronomie && markersByType["Gastronomie"]) {
        visibleMarkers.push(...markersByType["Gastronomie"]);
    }

    if (showHandel && markersByType["Handel"]) {
        visibleMarkers.push(...markersByType["Handel"]);
    }

    cluster.clearLayers();
    cluster.addLayers(visibleMarkers);
}

        (async () => {
        try {
            
            const res = await fetch("https://raw.githubusercontent.com/gaf-luis/map_data/refs/heads/main/test_gaffel_map_data%20(16).json");
            console.log("status", res.status, res.ok);
            const locations = await res.json();
                    
            locations.forEach(loc => {

                    const icon =
                    loc.absatzweg === "Gastronomie"
                        ? marker_gastro
                        : marker_handel;

                    const address = loc.kombi_addr;

                    const filter_criteria = loc.absatzweg

                    const marker = L.marker([loc.lat, loc.lng], { icon: icon })
                    .bindPopup(`
                        <div class="popup-name">${loc.name}</div>
                        <div class="popup-address">
                            ${loc.strasse}, ${loc.plz} ${loc.ort}
                        </div>
                        <div class="popup-sorten">
                            ${String(loc.sorten)
                            .replace(/Nicht\s*verfügbar/g, '<span class="status-no">Nicht verfügbar</span>')
                            .replace(/\bVerfügbar\b/g, '<span class="status-ok">Verfügbar</span>')
                            }
                        
                        </div>
                        <div class="popup-route">
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${address}"
                            target="_blank">
                            Routenplaner
                            </a>
                        </div>
                    `);
                    
                    allMarkers.push(marker);


                    if (!(filter_criteria in markersByType)) {  
                        markersByType[filter_criteria]=[]          
                    }
                    markersByType[filter_criteria].push(marker);
            })

            cluster.addLayers(allMarkers);

            } catch (err) {
                console.error("Failed to load map data:", err);
            }
        })();

       document.getElementById("gastronomie").addEventListener("change", updateVisibleMarkers);
document.getElementById("handel").addEventListener("change", updateVisibleMarkers);

updateVisibleMarkers();

</script>
</body>
</html>
