<!DOCTYPE html>
<html>
<head>
    <title>Verfügbarkeit | Gaffel Kölsch</title>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
    @font-face {
        font-family: "HelveticaNeueLtCom-Roman";
        src: url("https://gaffel.de/wp-content/themes/Divi-Child-Theme/fonts/HelveticaNeueLTCom-Roman.ttf") format("truetype");
        font-display: swap;
    }

     @font-face {
        font-family: "HelveticaNeueLtCom-Bold";
        src: url("https://gaffel.de/wp-content/themes/Divi-Child-Theme/fonts/HelveticaNeueLTCom-Bd.ttf") format("truetype");
        font-display: swap;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: "HelveticaNeueLtCom-Roman", Helvetica, sans-serif;
      font-size: 18px;
    }

    .leaflet-popup-content,
    .leaflet-popup-content-wrapper {
        font-family: "HelveticaNeueLtCom-Roman", Helvetica, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #control-panel {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        border: 1px solid rgba(0,23,76,0.08);
        box-shadow:
            0 8px 32px rgba(0,0,0,0.08),
            0 1px 3px rgba(0,0,0,0.05);
                border-radius: 16px;
        gap: 30px;
        padding: 12px 20px;
        background: #ffffff;
        backdrop-filter: blur(20px);
    }

    #logo-container {
        
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid rgba(255,255,255);
        border-radius: 16px;
    }


    #gaffel-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        transform: none;
        left: auto;
        top: auto;
    }

    #gaffel-logo-mobile {
        display: none;
    }

    #gaffel-logo img {
        width: 120px;
        height: auto;
    }

    #controls {
        display: flex;
        padding: 0;
        gap: 20px;
    }

    .control-item {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
        height: 42px;
        padding: 0 18px 0 48px;
        border-radius: 10px;
        background: #eceaea;
        color: #000000;
        border: 0;
        cursor: pointer;
        user-select: none;
        transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .control-item:hover {
        background: #dfddde;
        transform: none;
        box-shadow: 0px 10px 22px rgba(0, 23, 76, 0.2);
    }

    .control-item input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    .control-item:has(input[type="checkbox"]:checked) {
        background: #00263e;
        color: #ffffff; 
        box-shadow: 0 8px 18px rgba(0, 23, 76, 0.08);
    }

    .marker-circle {
        position: absolute;
        left: -11px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid #eceaea;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .control-item:has(input[type="checkbox"]:checked) .marker-circle {
        background: #ffffff;
        border-color: #00263e;
    }

    .marker-legend {
        width: 21px;
        height: auto;
        display: block;
        object-fit: contain;
        transform: translate(-0.5px);
    }

    .label-text {
        font-family: "HelveticaNeueLtCom-Roman", Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 400;

        letter-spacing: 0;
        line-height: 1;
        color: #000000;
        margin: 0;
        padding: 0;
        white-space: nowrap;
        transition: color 0.18s ease;
    }

    .control-item:has(input[type="checkbox"]:checked) .label-text {
        color: #ffffff;
    }

    .popup-name {
        font-size: 18px;
        font-weight: bold;
        line-height: 1;    
    }

    .popup-address {
        font-size: 14px;
        color: #666;
        margin-bottom: 6px;
    }

    .popup-sorten {
        background: #f8f8f8;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 10px;
        line-height: 1.4;
        border-left: 4px solid rgb(0, 23, 76);
    }
    
    .popup-route {
        text-align: center;
    }

    .popup-route a {
        display: inline-block;
        padding: 6px 10px;
        background: #0078ff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
    }

    .status-ok {
        color: #00703c;
    }

    .status-no {
        color: #c62828;
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
        background-color:rgb(0, 23, 76, 0.3) !important;
    }

    .marker-cluster div {
        background-color: rgb(0, 38, 62, 0.85) !important;
        color: rgb(255, 255, 255) !important;
        font-weight: bold; 
    }

    .leaflet-marker-pane{
        transition: opacity 0.15s ease-out;
    }

    .leaflet-tile {
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
    }

    .leaflet-tile-container {
        will-change: transform;
    }
    
    @media (max-width: 768px) {
        #control-panel {
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 0;
            gap: 0;
            width: auto;
        }

        #logo-container {
            display: none;
        }

        #gaffel-logo-mobile {
            bottom: 18px;
            right: 10px;
            display: flex;
            position: absolute;
            z-index: 1001;
            pointer-events: auto;
           
        }

        #gaffel-logo-mobile img {
            width: 80px;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .control-item {
            min-width: 60px;
            height: 36px;
            padding: 0 13px 0 40px;
            border-radius: 10px;
        }

        .marker-circle {
            left: -9px;
            width: 38px;
            height: 38px;
            border-width: 3px;
        }

        .marker-legend {
            width: 18px;
        }

        .label-text {
            font-size: 13px;
        }
    }   

    @media (max-width: 359px) {
            #controls {
                flex-direction: column;
            }

            .control-item{
                justify-content: left;
            }
        }

    </style>
</head>

<body>
        <div id="control-panel">
    <div id="logo-container">
        <div id="gaffel-logo">

            <a href="https://gaffel.de" target="_blank" rel="noopener noreferrer">
                <img
                    src="https://gaffel.de/wp-content/uploads/2021/04/Gaffel-Logo.svg"
                    alt="Gaffel Logo"
                    id="map-logo-mobile2"
                >
            </a>

        </div>
    </div>


            <div id="controls">
                <label class="control-item" style="margin-bottom: 0px;">
                    <input type="checkbox" id="gastronomie" checked>
                    <span class="label-text">Gastronomie</span>
                    <div class="marker-circle"><img
                    src="https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_blau.png"
                    alt="Gastronomie Marker"
                    class="marker-legend"></div>
                </label>

                <label class="control-item">
                    <input type="checkbox" id="handel" checked>
                    <span class="label-text">Handel</span>
                    <div class="marker-circle"><img
                    src="https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_weiss_4.png",
                    alt="Handel Marker"
                    class="marker-legend"></div>
                </label>
        </div>
    </div>

    <div id="gaffel-logo-mobile">

            <a href="https://gaffel.de" target="_blank" rel="noopener noreferrer">
                <img
                    src="https://gaffel.de/wp-content/uploads/2021/04/Gaffel-Logo.svg"
                    alt="Gaffel Logo"
                    id="map-logo-mobile2"
                >
            </a>

    </div>
    

    
    
    <div id="map"></div>
    
    <script>
        const isMobile = L.Browser.mobile;

        const map = L.map('map', {
            preferCanvas: true,
            zoomControl: !L.Browser.mobile,
            //fadeAnimation: !isMobile,
            //markerZoomAnimation: !isMobile,
            inertia: true
        }).setView([50.94, 6.96], 12);

        

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            updateWhenZooming: false,
            updateWhenIdle: false,
            keepBuffer: 4,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
        }).addTo(map);

        const cluster = L.markerClusterGroup({
            disableClusteringAtZoom: 14,
            maxClusterRadius: 100, 
            spiderfyOnMaxZoom: false,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            chunkedLoading: true,
            chunkInterval: 50

        });

        cluster.addTo(map);

        const markersByType = {};
        const allMarkers = [];

        const marker_gastro = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_blau.png',
            iconSize: [25, 42],
            iconAnchor: [12.5, 41],
            popupAnchor: [0, -24]
        });

        const marker_handel = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/gaf-luis/map_data/main/Gaffel_Marker_weiss_4.png',
            iconSize: [25, 42],
            iconAnchor: [12.5, 41],
            popupAnchor: [0, -24]
        });

        function updateVisibleMarkers() {
    const showGastronomie = document.getElementById("gastronomie").checked;
    const showHandel = document.getElementById("handel").checked;

    const visibleMarkers = [];

    if (showGastronomie && markersByType["Gastronomie"]) {
        visibleMarkers.push(...markersByType["Gastronomie"]);
    }

    if (showHandel && markersByType["Handel"]) {
        visibleMarkers.push(...markersByType["Handel"]);
    }

    cluster.clearLayers();
    cluster.addLayers(visibleMarkers);
}

        (async () => {
        try {
            
            const res = await fetch("https://raw.githubusercontent.com/gaf-luis/map_data/refs/heads/main/test_gaffel_map_data%20(16).json");
            console.log("status", res.status, res.ok);
            const locations = await res.json();
                    
            locations.forEach(loc => {

                    const icon =
                    loc.absatzweg === "Gastronomie"
                        ? marker_gastro
                        : marker_handel;

                    const address = loc.kombi_addr;

                    const filter_criteria = loc.absatzweg

                    const marker = L.marker([loc.lat, loc.lng], { icon: icon })
                    .bindPopup(`
                        <div class="popup-name">${loc.name}</div>
                        <div class="popup-address">
                            ${loc.strasse}, ${loc.plz} ${loc.ort}
                        </div>
                        <div class="popup-sorten">
                            ${String(loc.sorten)
                            .replace(/Nicht\s*verfügbar/g, '<span class="status-no">Nicht verfügbar</span>')
                            .replace(/\bVerfügbar\b/g, '<span class="status-ok">Verfügbar</span>')
                            }
                        
                        </div>
                        <div class="popup-route">
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${address}"
                            target="_blank">
                            Routenplaner
                            </a>
                        </div>
                    `);
                    
                    allMarkers.push(marker);


                    if (!(filter_criteria in markersByType)) {  
                        markersByType[filter_criteria]=[]          
                    }
                    markersByType[filter_criteria].push(marker);
            })

            cluster.addLayers(allMarkers);

            } catch (err) {
                console.error("Failed to load map data:", err);
            }
        })();

       document.getElementById("gastronomie").addEventListener("change", updateVisibleMarkers);
document.getElementById("handel").addEventListener("change", updateVisibleMarkers);

updateVisibleMarkers();

</script>
</body>
</html>
